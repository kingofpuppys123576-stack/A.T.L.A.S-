<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MICHAEL" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
  <title>MICHAEL</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">MODULAR INTELLIGENCE FOR COMMUNICATION, HELP, AUTOMATION, EXECUTION & LEARNING</p>
        <h1>M.I.C.H.A.E.L.</h1>
      </div>
      <span id="status" class="status">READY</span>
    </header>

    <section class="hero">
      <button id="orb" class="orb" type="button" aria-label="Talk to MICHAEL">
        <span class="orb-core"></span>
      </button>
      <h2 id="prompt">Tap to speak</h2>
      <p id="subprompt">MICHAEL V1 • Voice interface</p>
    </section>

    <section id="conversation" class="conversation" aria-live="polite">
      <div class="message atlas">
        <span>MICHAEL</span>
        <p>Systems online. Tap the center control and speak.</p>
      </div>
    </section>

    <form id="chatForm" class="composer">
      <input id="messageInput" type="text" autocomplete="off" placeholder="Message MICHAEL…" aria-label="Message MICHAEL" />
      <button type="submit">Send</button>
    </form>

    <p class="note">MICHAEL V1 • AI Core connected</p>
  </main>
  <script src="app.js?v=4"></script>
</body>
</html>
